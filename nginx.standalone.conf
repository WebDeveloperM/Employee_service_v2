resolver 127.0.0.11 valid=10s;

# Versioned assets ({% asset %} adds ?v=<content hash>) never change under the same URL: cache for a year.
# Unversioned files (admin, old links) are revalidated after an hour.
map $arg_v $static_cache_control {
    ""      "public, max-age=3600";
    default "public, max-age=31536000, immutable";
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;
    server_tokens off;   # do not advertise the nginx version

    ssl_certificate /etc/nginx/certs/employee.crt;
    ssl_certificate_key /etc/nginx/certs/employee.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_tickets off;
    # Resume TLS sessions: without a session cache every new connection did a full handshake.
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 4h;

    # Employee ".pfx" login keys (see employees/pki.py): trust the service's
    # own CA for client certs, but "optional" keeps normal password/Face ID
    # login working for everyone who has not been issued a key yet.
    ssl_client_certificate /etc/nginx/pki/ca.crt;
    ssl_verify_client optional;

    # Largest real uploads: employee photos and Excel imports (Django itself caps the body at 20 MB).
    client_max_body_size 30M;

    # Pages carry 50-170 KB of inline JS and the API returns large JSON lists: compress them.
    # (Django masks the CSRF token in every response, so compressing HTML does not expose it to BREACH.)
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types text/css text/plain text/javascript application/javascript application/json
               application/xml image/svg+xml font/ttf application/vnd.ms-fontobject;

    # Django already sends X-Frame-Options, X-Content-Type-Options and Referrer-Policy (settings.py);
    # the camera is used only by our own pages (login Face ID, employee photo).
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;

    # Never serve dotfiles (.env, .git) even if a location is misconfigured later.
    location ~ /\. {
        return 404;
    }

    # Browsers ask for it on every page; the site has none. Answer here instead of a Django 404 page.
    location = /favicon.ico {
        access_log off;
        log_not_found off;
        return 204;
    }

    # CSS/JS/fonts straight from the collectstatic output (./staticfiles), not through gunicorn.
    location /static/ {
        alias /srv/static/;
        access_log off;
        # Not "always": the one-year "immutable" lifetime must never be attached to an error response, or a browser
        # that got a single 404 (files not collected yet, empty mount) would keep it for a year under that URL.
        add_header Cache-Control $static_cache_control;
        add_header X-Content-Type-Options nosniff always;
        add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
        # The file is not (yet) visible in this container's /srv/static: let Django (whitenoise) answer instead,
        # so a stale or empty mount can never leave the pages without CSS.
        error_page 403 404 = @django;
    }

    # Photos: Django (employees/media_views.py) checks access and answers with X-Accel-Redirect;
    # nginx then sends the file from here. "internal": a client cannot open this location directly.
    location /protected-media/ {
        internal;
        alias /srv/media/;
        # Content-Type and Cache-Control come from Django's response (nginx keeps them on X-Accel-Redirect).
        add_header X-Content-Type-Options nosniff always;
        add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
    }

    # Same proxy settings as "location /" below (keep both in sync): used as the /static/ fallback.
    location @django {
        set $upstream_employee_service http://employee-service:5000;
        proxy_pass $upstream_employee_service;
        proxy_set_header Host $http_host;
        # nginx is the edge: the client address is $remote_addr; anything the client sent is replaced.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-SSL-Client-Verify $ssl_client_verify;
        proxy_set_header X-SSL-Client-Serial $ssl_client_serial;
        proxy_read_timeout 130s;
    }

    location / {
        set $upstream_employee_service http://employee-service:5000;
        proxy_pass $upstream_employee_service;
        proxy_set_header Host $http_host;
        # nginx is the edge: the client address is $remote_addr; anything the client sent is replaced.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-SSL-Client-Verify $ssl_client_verify;
        proxy_set_header X-SSL-Client-Serial $ssl_client_serial;
        proxy_read_timeout 130s;
    }
}
