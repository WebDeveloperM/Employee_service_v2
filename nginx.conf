resolver 127.0.0.11 valid=10s;

server {
    listen 443 ssl;
    server_name _;

    ssl_certificate /etc/nginx/certs/employee.crt;
    ssl_certificate_key /etc/nginx/certs/employee.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Employee ".pfx" login keys (see employees/pki.py): trust the service's
    # own CA for client certs, but "optional" keeps normal password/Face ID
    # login working for everyone who has not been issued a key yet.
    ssl_client_certificate /etc/nginx/pki/ca.crt;
    ssl_verify_client optional;

    client_max_body_size 250M;

    location / {
        set $upstream_employee_service http://employee-service:5000;
        proxy_pass $upstream_employee_service;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-SSL-Client-Verify $ssl_client_verify;
        proxy_set_header X-SSL-Client-Serial $ssl_client_serial;
    }
}
