{# «Лавозим тоифаси» рўйхатига янги тоифа қўшиш ойнаси. Ходим формаси (яратиш/таҳрирлаш) ичига қўшилади; селект: #position_category_id. #}
<div id="positionCategoryModal" class="fixed inset-0 z-50 hidden items-center justify-center bg-slate-950/75 px-4">
    <div class="w-full max-w-lg rounded-[28px] bg-white p-6 shadow-2xl">
        <div class="flex items-start justify-between gap-4">
            <div>
                <h3 class="font-display text-2xl font-bold text-slate-900">Тоифа қўшиш</h3>
                <p class="mt-1 text-sm text-slate-500">Лавозим тоифасини қўшинг, у рўйхатда дарҳол танланади.</p>
            </div>
            <button type="button" onclick="closePositionCategoryModal()" class="rounded-xl border border-slate-200 px-3 py-2 text-slate-500 hover:bg-slate-50">
                <i class="fas fa-times"></i>
            </button>
        </div>

        <form class="mt-5 space-y-4" onsubmit="saveInlinePositionCategory(event)">
            <div>
                <label class="mb-2 block text-sm font-bold text-slate-700" for="inlinePositionCategoryName">Тоифа номи <span class="text-red-500">*</span></label>
                <input type="text" id="inlinePositionCategoryName" required maxlength="100" autocomplete="off" class="table-filter" placeholder="Масалан, Раҳбар">
            </div>
            <div class="flex justify-end gap-3">
                <button type="button" onclick="closePositionCategoryModal()" class="rounded-xl border border-slate-200 px-4 py-2 text-sm font-bold text-slate-600 hover:bg-slate-50">Бекор қилиш</button>
                <button type="submit" id="inlinePositionCategorySaveButton" class="rounded-xl bg-[var(--info)] px-4 py-2 text-sm font-bold text-white">Сақлаш</button>
            </div>
        </form>
    </div>
</div>

<script>
    function openPositionCategoryModal() {
        const modal = document.getElementById('positionCategoryModal');
        modal.classList.remove('hidden');
        modal.classList.add('flex');
        window.setTimeout(() => document.getElementById('inlinePositionCategoryName').focus(), 0);
    }

    function closePositionCategoryModal() {
        const modal = document.getElementById('positionCategoryModal');
        modal.classList.add('hidden');
        modal.classList.remove('flex');
        document.getElementById('inlinePositionCategoryName').value = '';
    }

    async function saveInlinePositionCategory(event) {
        event.preventDefault();

        const saveButton = document.getElementById('inlinePositionCategorySaveButton');
        setLoading(saveButton, true, 'Сақланмоқда...');

        try {
            const response = await fetch(`${API_BASE}/template/position-categories/`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': getCookie('csrftoken'),
                },
                body: JSON.stringify({ name: document.getElementById('inlinePositionCategoryName').value.trim() }),
            });

            const payload = await response.json().catch(() => null);   // JSON бўлмаган жавобда (масалан, сервер хатоси) умумий хабар чиқади
            if (!response.ok) {
                throw new Error(extractApiErrorMessage(payload) || 'Тоифа қўшилмади');
            }

            // Янги тоифани рўйхат охирига қўшиб, ходимга дарҳол танлаймиз.
            const select = document.getElementById('position_category_id');
            const option = document.createElement('option');
            option.value = String(payload.data.id);
            option.textContent = payload.data.name;
            select.appendChild(option);
            select.value = option.value;

            closePositionCategoryModal();
            showToast('Тоифа муваффақиятли қўшилди');
        } catch (error) {
            showToast(error.message, 'error');
        } finally {
            setLoading(saveButton, false);
        }
    }
</script>
