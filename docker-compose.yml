services:
  employee-service:
    build:
      context: .
    container_name: es_app
    restart: unless-stopped
    env_file:
      - .env
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:5000"
    environment:
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,employee-service}
      EMPLOYEE_SERVICE_API_KEYS: "dev-employee-service-key"
      FACE_SIMILARITY_THRESHOLD: "72.0"
    volumes:
      - .:/app
      # Mask these two out of the bind mount: they add ~900 host files that
      # Docker Desktop on Windows has to sync on every read, and the app
      # never needs them at runtime (deps live in the image, not .venv).
      - /app/.venv
      - /app/.git

  nginx:
    image: nginx:1.27-alpine
    container_name: es_https
    restart: unless-stopped
    depends_on:
      - employee-service
    ports:
      - "5000:443"
    volumes:
      - ./nginx.standalone.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
      # ca.crt is generated by employee-service on startup (employees/apps.py)
      # so nginx can verify employee ".pfx" client certs against it.
      - ./pki:/etc/nginx/pki:ro
