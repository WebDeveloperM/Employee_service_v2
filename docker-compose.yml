services:
  employee-service:
    build:
      context: .
    container_name: es_app
    restart: unless-stopped
    env_file:
      - .env
    # gunicorn instead of "manage.py runserver": the development server is not meant for production.
    # Workers/threads/timeouts: config/gunicorn.conf.py (GUNICORN_WORKERS / GUNICORN_THREADS in .env).
    # Several workers share the login/Face ID counters through the file cache (settings.CACHES).
    command: >-
      sh -c "python manage.py migrate --noinput
      && python manage.py collectstatic --noinput
      && gunicorn -c config/gunicorn.conf.py config.wsgi:application"
    environment:
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,employee-service}
      # EMPLOYEE_SERVICE_API_KEYS comes from .env (the old hard-coded "dev-employee-service-key" was public).
      FACE_SIMILARITY_THRESHOLD: "72.0"
      # Photos: Django checks access, nginx sends the file (nginx.standalone.conf, /protected-media/).
      MEDIA_X_ACCEL_REDIRECT: "true"
    volumes:
      - .:/app
      # Mask these two out of the bind mount: they add ~900 host files that
      # Docker Desktop on Windows has to sync on every read, and the app
      # never needs them at runtime (deps live in the image, not .venv).
      - /app/.venv
      - /app/.git

  nginx:
    image: nginx:1.27-alpine
    container_name: es_https
    restart: unless-stopped
    depends_on:
      - employee-service
    ports:
      - "5000:443"
    volumes:
      - ./nginx.standalone.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
      # ca.crt is generated by employee-service on startup (employees/apps.py)
      # so nginx can verify employee ".pfx" client certs against it.
      - ./pki:/etc/nginx/pki:ro
      # nginx serves CSS/JS/fonts (collectstatic output) and photos itself instead of gunicorn.
      - ./staticfiles:/srv/static:ro
      - ./media:/srv/media:ro
